<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <title>Тысячи врат: Текстовая RPG</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        html, body {
            touch-action: manipulation;
        }
        body {
            background: #0a0c16;
            font-family: system-ui, -apple-system, monospace;
            margin: 0;
            padding: 8px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #eef4ff;
            overflow: hidden;
            position: fixed;
            width: 100%;
            touch-action: pan-y pinch-zoom;
        }
        .game-container {
            max-width: 700px;
            margin: 0 auto;
            background: #03060e;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            box-shadow: 0 0 0 1px #2a3f55;
            overflow: hidden;
        }
        .stats-panel {
            background: #010a17;
            padding: 8px 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: space-between;
            font-size: 0.7rem;
            font-weight: bold;
            border-bottom: 1px solid #1f3a4b;
            flex-shrink: 0;
        }
        .stats-panel span { color: #f5bc70; }
        .enemy-panel {
            background: #0d1a2a;
            padding: 8px;
            margin: 6px 10px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #051020;
            font-size: 0.8rem;
            -webkit-overflow-scrolling: touch;
        }
        .msg {
            background: #0f1a2c;
            padding: 6px 10px;
            border-radius: 18px;
            word-wrap: break-word;
            border-left: 3px solid #4c7a9a;
            align-self: flex-start;
            max-width: 94%;
        }
        .msg.system {
            background: #121e2e;
            border-left-color: #d6b356;
        }
        /* ДВЕ КОЛОНКИ КНОПОК - БЕЗ ЗУМА ПРИ КЛИКЕ */
        .buttons-panel {
            background: #030c17;
            padding: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            border-top: 1px solid #1a3045;
            border-bottom: 1px solid #1a3045;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .buttons-panel button {
            background: #1f3a52;
            border: none;
            color: white;
            font-weight: bold;
            padding: 10px 8px;
            border-radius: 40px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.05s linear;
            text-align: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .buttons-panel button:active { transform: scale(0.96); background: #2c5a7a; }
        .active-mode { background: #4c7a9a !important; box-shadow: 0 0 6px #7ab3c8; }
        /* ПОЛЕ ВВОДА */
        .input-area {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #030c17;
            border-top: 1px solid #1a3045;
            flex-shrink: 0;
        }
        input {
            flex: 1;
            background: #0f1b2f;
            border: none;
            padding: 12px 16px;
            border-radius: 40px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            touch-action: manipulation;
        }
        button { background: #2c4f6e; border: none; color: white; padding: 8px 16px; border-radius: 40px; cursor: pointer; touch-action: manipulation; }
        .hidden { display: none; }
        .sub-panel {
            background: #0a1424;
            margin: 5px 10px;
            border-radius: 20px;
            padding: 8px;
            max-height: 200px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .class-selector { display: flex; gap: 12px; justify-content: center; margin: 10px; }
        .class-btn { background: #2a3f55; padding: 12px; flex: 1; text-align: center; border-radius: 60px; font-weight: bold; cursor: pointer; touch-action: manipulation; }
        .select-list { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; max-height: 150px; overflow-y: auto; }
        .select-item { background: #162336; padding: 6px 10px; border-radius: 40px; cursor: pointer; margin: 2px; font-size: 0.7rem; touch-action: manipulation; }
        .craft-item { background: #162336; padding: 6px; border-radius: 16px; margin: 4px; cursor: pointer; touch-action: manipulation; }
        .craft-recipe { font-size: 0.6rem; color: #aac8ff; }
        .craft-damage { font-size: 0.65rem; color: #ffaa66; font-weight: bold; margin-left: 6px; }
        .shop-item { background: #162336; padding: 6px 10px; border-radius: 40px; margin: 3px; cursor: pointer; font-size: 0.7rem; display: flex; justify-content: space-between; touch-action: manipulation; }
        hr { border-color: #2e4b6e; margin: 5px; }
    </style>
</head>
