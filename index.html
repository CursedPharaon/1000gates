<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>RPG | Тычячи врат</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #0a0c16;
            font-family: -apple-system, system-ui, monospace;
            margin: 0;
            padding: 10px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #eef4ff;
        }
        .game-container {
            max-width: 700px;
            margin: 0 auto;
            background: #03060e;
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            height: 98%;
            box-shadow: 0 0 0 1px #2a3f55;
            overflow: hidden;
        }
        .stats {
            background: #010a17;
            padding: 10px 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: bold;
            border-bottom: 1px solid #1f3a4b;
        }
        .stats span {
            color: #f5bc70;
        }
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #051020;
        }
        .msg {
            background: #0f1a2c;
            padding: 8px 14px;
            border-radius: 20px;
            word-wrap: break-word;
            font-size: 0.9rem;
            border-left: 4px solid #4c7a9a;
            align-self: flex-start;
            max-width: 92%;
        }
        .msg.system {
            background: #121e2e;
            border-left-color: #d6b356;
            font-family: monospace;
        }
        .input-area {
            background: #081220;
            padding: 10px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #1f4162;
        }
        input {
            flex: 1;
            background: #0f1b2f;
            border: none;
            padding: 12px 16px;
            border-radius: 60px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }
        button {
            background: #2c4f6e;
            border: none;
            padding: 0 20px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .hint {
            font-size: 0.65rem;
            text-align: center;
            padding: 6px;
            color: #6f8eae;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="stats">
        <div>⚔️ УРОВЕНЬ <span id="lvl">1</span></div>
        <div>⭐ ОПЫТ <span id="xpCur">0</span>/<span id="xpMax">100</span></div>
        <div>❤️ HP <span id="hp">140</span>/<span id="maxHp">140</span></div>
        <div>🪙 ЗОЛОТО <span id="gold">400</span></div>
        <div>💪 СИЛ <span id="pCount">0</span></div>
    </div>
    <div class="chat" id="chatArea">
        <div class="msg system">✨ Добро пожаловать в RPG: Тысячи врат.</div>
        <div class="msg system">📜 <strong>помощь</strong> — список команд.</div>
    </div>
    <div class="input-area">
        <input type="text" id="cmdInput" placeholder="команда..." autocomplete="off">
        <button id="sendBtn">➤</button>
    </div>
    <div class="hint">квесты | боссы | атака | лечить | кейс | магазин | инвентарь</div>
</div>

<script>
    // ---------- СИЛЫ (20 штук) ----------
    const POWERS = [
        { id: "p1", name: "🗡️ Кинжал новичка", rarity: "common", bonus: 6, cost: 100, source: "shop" },
        { id: "p2", name: "🛡️ Деревянный щит", rarity: "common", bonus: 8, cost: 130, source: "shop" },
        { id: "p3", name: "🏹 Короткий лук", rarity: "common", bonus: 10, cost: 160, source: "shop" },
        { id: "p4", name: "🧤 Рукавицы силы", rarity: "common", bonus: 7, cost: 110, source: "shop" },
        { id: "p5", name: "👢 Быстрые сапоги", rarity: "common", bonus: 5, cost: 90, source: "shop" },
        { id: "p6", name: "⚡ Громовой клинок", rarity: "rare", bonus: 22, cost: 450, source: "shop" },
        { id: "p7", name: "❄️ Ледяное сердце", rarity: "rare", bonus: 25, cost: 500, source: "shop" },
        { id: "p8", name: "🔥 Пламенный тотем", rarity: "rare", bonus: 24, cost: 480, source: "shop" },
        { id: "p9", name: "🌪️ Клинок вихря", rarity: "rare", bonus: 28, cost: 560, source: "shop" },
        { id: "p10", name: "👑 Корона теней", rarity: "rare", bonus: 20, cost: 420, source: "shop" },
        { id: "p11", name: "⭐ Световой меч порядка", rarity: "epic", bonus: 55, cost: 0, source: "boss:Ангел Света" },
        { id: "p12", name: "🌙 Пассивка теней", rarity: "epic", bonus: 48, cost: 0, source: "boss:Владыка тьмы" },
        { id: "p13", name: "💀 Череп лича", rarity: "epic", bonus: 52, cost: 0, source: "boss:Лич Некромант" },
        { id: "p14", name: "⚜️ Крылья феникса", rarity: "epic", bonus: 60, cost: 0, source: "boss:Феникс" },
        { id: "p15", name: "🐉 Дыхание древнего", rarity: "epic", bonus: 74, cost: 2200, source: "shop" },
        { id: "p16", name: "🌀 Меч тысячелетия", rarity: "epic", bonus: 68, cost: 0, source: "boss:Древний воин" },
        { id: "p17", name: "🕯️ Свеча забвения", rarity: "rare", bonus: 30, cost: 0, source: "boss:Призрачный огонь" },
        { id: "p18", name: "💎 Пассивка стойкости", rarity: "epic", bonus: 44, cost: 0, source: "boss:Каменный голем" },
        { id: "p19", name: "⚔️ Ультра-меч рассвета", rarity: "legend", bonus: 95, cost: 0, source: "boss:Бог Рассвета" },
        { id: "p20", name: "🌑 Клинок бездны", rarity: "legend", bonus: 98, cost: 0, source: "boss:Повелитель бездны" }
    ];

    // КВЕСТЫ
    const QUESTS = [
        { name: "Гоблин-разбойник", baseHp: 80, baseAtk: 18, xpRew: 28, goldMin: 40, goldMax: 85, dropChance: 0.25, dropPool: ["common"] },
        { name: "Лесной волк", baseHp: 110, baseAtk: 26, xpRew: 38, goldMin: 60, goldMax: 120, dropChance: 0.3, dropPool: ["common"] },
        { name: "Скелет-воин", baseHp: 160, baseAtk: 35, xpRew: 50, goldMin: 85, goldMax: 170, dropChance: 0.35, dropPool: ["common","rare"] },
        { name: "Тролль-берсерк", baseHp: 240, baseAtk: 48, xpRew: 70, goldMin: 130, goldMax: 240, dropChance: 0.4, dropPool: ["common","rare"] },
        { name: "Огненный элементаль", baseHp: 340, baseAtk: 68, xpRew: 95, goldMin: 190, goldMax: 340, dropChance: 0.45, dropPool: ["rare"] }
    ];

    // БОССЫ
    const BOSS_LIST = [
        { id: 0, name: "🍄 Грибной король", tier: "малый", baseHp: 300, baseAtk: 45, goldMin: 200, goldMax: 380, drops: [{ powerId: "p17", chance: 0.5 },{ powerId: "p2", chance: 0.4 }] },
        { id: 1, name: "🗿 Каменный голем", tier: "средний", baseHp: 680, baseAtk: 78, goldMin: 420, goldMax: 700, drops: [{ powerId: "p18", chance: 0.55 },{ powerId: "p4", chance: 0.5 },{ powerId: "p6", chance: 0.3 }] },
        { id: 2, name: "👻 Призрачный огонь", tier: "средний", baseHp: 950, baseAtk: 105, goldMin: 600, goldMax: 980, drops: [{ powerId: "p17", chance: 0.6 },{ powerId: "p9", chance: 0.45 }] },
        { id: 3, name: "🦴 Лич Некромант", tier: "жестокий", baseHp: 1550, baseAtk: 150, goldMin: 1000, goldMax: 1650, drops: [{ powerId: "p13", chance: 0.7 },{ powerId: "p7", chance: 0.6 },{ powerId: "p10", chance: 0.5 }] },
        { id: 4, name: "🔥 Феникс", tier: "жестокий", baseHp: 2200, baseAtk: 210, goldMin: 1500, goldMax: 2400, drops: [{ powerId: "p14", chance: 0.7 },{ powerId: "p8", chance: 0.65 },{ powerId: "p19", chance: 0.2 }] },
        { id: 5, name: "😈 Владыка тьмы", tier: "легендарный", baseHp: 3800, baseAtk: 320, goldMin: 2800, goldMax: 4300, drops: [{ powerId: "p12", chance: 0.8 },{ powerId: "p15", chance: 0.7 },{ powerId: "p20", chance: 0.25 }] },
        { id: 6, name: "⚜️ Ангел Света", tier: "легендарный", baseHp: 4700, baseAtk: 390, goldMin: 3600, goldMax: 5600, drops: [{ powerId: "p11", chance: 0.85 },{ powerId: "p16", chance: 0.75 },{ powerId: "p14", chance: 0.5 }] },
        { id: 7, name: "🐉 Древний воин", tier: "мифический", baseHp: 6900, baseAtk: 550, goldMin: 6000, goldMax: 9200, drops: [{ powerId: "p16", chance: 1.0 },{ powerId: "p19", chance: 0.7 },{ powerId: "p20", chance: 0.6 }] },
        { id: 8, name: "🌞 Бог Рассвета", tier: "мифический", baseHp: 10500, baseAtk: 820, goldMin: 9500, goldMax: 14500, drops: [{ powerId: "p19", chance: 1.0 },{ powerId: "p11", chance: 0.9 },{ powerId: "p14", chance: 0.8 }] },
        { id: 9, name: "🌀 Повелитель бездны", tier: "космический", baseHp: 16000, baseAtk: 1250, goldMin: 15000, goldMax: 23000, drops: [{ powerId: "p20", chance: 1.0 },{ powerId: "p12", chance: 0.9 },{ powerId: "p19", chance: 0.8 },{ powerId: "p15", chance: 0.95 }] }
    ];

    let player = {
        level: 1, xp: 0, gold: 400, hp: 140, maxHp: 140,
        inventory: ["p1"],
        currentEnemy: null,
        enemyType: null,
        bossIndex: 0,
        questIndex: 0,
        secretFlags: { phoenixUsed: false, mapUsed: false, dawnUsed: false, abyssUsed: false }
    };

    function recalcBonus() { return player.inventory.reduce((sum, pid) => { let p = POWERS.find(x => x.id === pid); return sum + (p ? p.bonus : 0); }, 0); }
    function getAttack() { return 12 + player.level * 2 + recalcBonus(); }
    function updateUI() {
        let need = 80 + player.level * 7;
        document.getElementById("lvl").innerText = player.level;
        document.getElementById("xpCur").innerText = player.xp;
        document.getElementById("xpMax").innerText = need;
        document.getElementById("hp").innerText = player.hp;
        document.getElementById("maxHp").innerText = player.maxHp;
        document.getElementById("gold").innerText = Math.floor(player.gold);
        document.getElementById("pCount").innerText = player.inventory.length;
    }
    function addSys(msg) { let chat = document.getElementById("chatArea"); let d = document.createElement("div"); d.className = "msg system"; d.innerHTML = msg; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; }
    function gainXp(amt) {
        player.xp += amt; let need = 80 + player.level * 7;
        while (player.xp >= need && player.level < 1400) { player.xp -= need; player.level++; player.maxHp = 120 + player.level * 5; player.hp = player.maxHp; addSys(`✨ УРОВЕНЬ ${player.level}!`); need = 80 + player.level * 7; }
        updateUI();
    }
    function loadQuestMob() {
        let q = QUESTS[player.questIndex % QUESTS.length];
        let bonusHp = Math.floor(q.baseHp * (player.level / 140));
        player.currentEnemy = { name: q.name, baseHp: q.baseHp, baseAtk: q.baseAtk, currentHp: Math.min(18000, q.baseHp + bonusHp), xpRew: q.xpRew + player.level, goldMin: q.goldMin, goldMax: q.goldMax, dropChance: q.dropChance, dropPool: q.dropPool };
        player.enemyType = "quest";
        addSys(`⚔️ КВЕСТ: ${player.currentEnemy.name} ❤️ ${player.currentEnemy.currentHp}`);
    }
    function loadBossByIdx(idx) {
        let b = BOSS_LIST[Math.min(idx, BOSS_LIST.length-1)];
        let bonusHp = Math.floor(b.baseHp * (player.level / 150));
        player.currentEnemy = { name: b.name, tier: b.tier, baseHp: b.baseHp, baseAtk: b.baseAtk, currentHp: Math.min(50000, b.baseHp + bonusHp), goldMin: b.goldMin, goldMax: b.goldMax, drops: b.drops, bossId: b.id };
        player.enemyType = "boss";
        addSys(`👾 БОСС [${b.tier}]: ${player.currentEnemy.name} ❤️ ${player.currentEnemy.currentHp}`);
    }
    function attack() {
        if (!player.currentEnemy) { addSys("Сначала выберите цель: квесты или боссы"); return; }
        let dmg = getAttack();
        player.currentEnemy.currentHp -= dmg;
        addSys(`⚡ Урон ${dmg}. У противника осталось ${Math.max(0, player.currentEnemy.currentHp)} HP.`);
        if (player.currentEnemy.currentHp <= 0) {
            let goldGain = Math.floor(Math.random() * (player.currentEnemy.goldMax - player.currentEnemy.goldMin + 1) + player.currentEnemy.goldMin);
            player.gold += goldGain;
            addSys(`🏆 ПОБЕДА! +${goldGain} золота.`);
            let xpRew = (player.enemyType === "quest") ? player.currentEnemy.xpRew : (80 + player.level * 3);
            gainXp(xpRew);
            if (player.enemyType === "quest") {
                if (Math.random() < player.currentEnemy.dropChance) {
                    let possible = POWERS.filter(p => player.currentEnemy.dropPool.includes(p.rarity) && p.source === "shop");
                    if (possible.length) {
                        let drop = possible[Math.floor(Math.random() * possible.length)];
                        if (!player.inventory.includes(drop.id)) { player.inventory.push(drop.id); addSys(`📦 ДРОП: ${drop.name} добавлена!`); }
                        else { player.gold += 70; addSys(`🔄 Дубликат → +70 золота.`); }
                    }
                }
            } else {
                for (let d of player.currentEnemy.drops) {
                    if (Math.random() < d.chance) {
                        let pwr = POWERS.find(x => x.id === d.powerId);
                        if (pwr && !player.inventory.includes(pwr.id)) { player.inventory.push(pwr.id); addSys(`💎 ДРОП БОССА: ${pwr.name} [+${pwr.bonus}]!`); }
                        else if (pwr) { player.gold += 120; addSys(`💰 Дубликат → +120 золота.`); }
                    }
                }
                if (player.enemyType === "boss" && player.currentEnemy.bossId !== undefined && player.currentEnemy.bossId + 1 < BOSS_LIST.length) player.bossIndex = player.currentEnemy.bossId + 1;
            }
            player.currentEnemy = null;
            updateUI(); saveGame();
            return;
        }
        let enemyAtk = player.currentEnemy.baseAtk + Math.floor(player.level * 0.7);
        let dmgToPlayer = Math.max(6, enemyAtk - Math.floor(recalcBonus() / 3));
        player.hp -= dmgToPlayer;
        addSys(`😖 Контратака! -${dmgToPlayer} HP (осталось ${player.hp}/${player.maxHp})`);
        if (player.hp <= 0) { addSys(`💀 ВЫ ПОВЕРЖЕНЫ... Потеря 15% золота.`); player.gold = Math.floor(player.gold * 0.85); player.hp = player.maxHp; player.currentEnemy = null; }
        updateUI(); saveGame();
    }
    function heal() { let cost = 45; if (player.gold >= cost && player.hp < player.maxHp) { player.gold -= cost; player.hp = Math.min(player.maxHp, player.hp + 35 + Math.floor(player.level*0.9)); addSys(`💚 Лечение. -${cost} золота.`); } else addSys(`❌ Не хватает или HP полное.`); updateUI(); saveGame(); }
    function caseOpen() { if (player.gold < 200) { addSys(`💰 Нужно 200 золота.`); return; } player.gold -= 200; let r = Math.random(); let tier = "common"; if (r > 0.75) tier = "epic"; else if (r > 0.4) tier = "rare"; let possible = POWERS.filter(p => p.rarity === tier && p.source === "shop"); if (!possible.length) possible = POWERS.filter(p => p.source === "shop"); let got = possible[Math.floor(Math.random() * possible.length)]; if (!player.inventory.includes(got.id)) { player.inventory.push(got.id); addSys(`🎁 КЕЙС: ${got.name} (${got.rarity}) +${got.bonus}!`); } else { player.gold += 80; addSys(`🎁 КЕЙС: дубликат → +80 золота.`); } updateUI(); saveGame(); }
    function shop() { let list = POWERS.filter(p => p.source === "shop").map(p => `${p.id} → ${p.name} (+${p.bonus}) [${p.rarity}] ${player.inventory.includes(p.id) ? "✅" : p.cost+"💰"}`).join("\n"); addSys(`🏪 МАГАЗИН:\n${list}\nкупить pX`); }
    function buy(pId) { let power = POWERS.find(p => p.id === pId && p.source === "shop"); if (!power) { addSys(`Нет такой.`); return; } if (player.inventory.includes(power.id)) { addSys(`Уже есть.`); return; } if (player.gold >= power.cost) { player.gold -= power.cost; player.inventory.push(power.id); addSys(`✅ Куплено: ${power.name}!`); updateUI(); saveGame(); } else addSys(`Не хватает.`); }
    function inv() { if (player.inventory.length === 0) addSys(`📭 Пусто.`); else { let list = player.inventory.map(pid => { let p = POWERS.find(pw => pw.id === pid); return `${p.name} [+${p.bonus}] ${p.rarity}`; }).join(", "); addSys(`📦 ИНВЕНТАРЬ: ${list}`); } }
    function showQuests() { let str = QUESTS.map((q, i) => `${i+1}. ${q.name}`).join("\n"); addSys(`📜 КВЕСТЫ:\n${str}\nквест N`); }
    function startQuest(num) { if (num>=1 && num<=QUESTS.length) { player.questIndex = num-1; loadQuestMob(); } else addSys(`Неверный номер.`); }
    function showBosses() { let str = BOSS_LIST.map((b, i) => `${i}. ${b.name} [${b.tier}]`).join("\n"); addSys(`👑 БОССЫ:\n${str}\nбосс N`); }
    function startBoss(num) { if (num>=0 && num<BOSS_LIST.length) { player.bossIndex = num; loadBossByIdx(num); } else addSys(`Неверный номер.`); }
    function help() { addSys(`🔰 КОМАНДЫ:\nквесты, квест N, боссы, босс N, атака, лечить, кейс, магазин, купить pX, инвентарь, статы, помощь`); }
    function statsCmd() { addSys(`⚡ Уровень ${player.level}, опыт ${player.xp}, золото ${Math.floor(player.gold)}, сил: ${player.inventory.length}, атака: ${getAttack()}, HP: ${player.hp}/${player.maxHp}`); }

    // ===================== СЕКРЕТНЫЕ КОМАНДЫ (работают через чат) =====================
    function checkSecrets(word) {
        let w = word.toLowerCase().trim();
        if (w === "темнее") { player.gold += 500; addSys("🌑 Тьма шепчет... +500 золота."); saveGame(); updateUI(); return true; }
        if (w === "основа") { if (!player.inventory.includes("p14")) { player.inventory.push("p14"); addSys("🔥 Ты нашёл Крылья Феникса! Сила добавлена."); recalcBonus(); saveGame(); updateUI(); } else addSys("Основа уже была."); return true; }
        if (w === "никогда") { player.hp = player.maxHp; addSys("🌟 Таинственное слово исцелило тебя полностью!"); updateUI(); saveGame(); return true; }
        if (w === "забвение") { let exp = 250 + player.level * 5; gainXp(exp); addSys(`📜 Забвение дало ${exp} опыта.`); saveGame(); return true; }
        if (w === "шепот") { player.gold += 1000; addSys("👂 Шёпот из стены... +1000 золота"); updateUI(); saveGame(); return true; }
        if (w === "карта") { if (player.bossIndex >= 4 && !player.secretFlags.mapUsed) { player.secretFlags.mapUsed = true; if (!player.inventory.includes("p10")) { player.inventory.push("p10"); addSys("🗺️ Тайная карта! Вы получили Корону теней."); recalcBonus(); } else player.gold += 300; saveGame(); updateUI(); } else addSys("Карта молчит... (нужно победить 5+ боссов)"); return true; }
        if (w === "рассвет") { if (player.level >= 20 && !player.secretFlags.dawnUsed) { player.secretFlags.dawnUsed = true; if (!player.inventory.includes("p11")) { player.inventory.push("p11"); addSys("🌅 Рассвет озарил тебя! + Световой меч порядка."); recalcBonus(); } else player.gold += 500; saveGame(); updateUI(); } else addSys("Рассвет не пришёл (нужен уровень 20+)"); return true; }
        if (w === "бездна") { if (player.bossIndex >= 9 && !player.secretFlags.abyssUsed) { player.secretFlags.abyssUsed = true; if (!player.inventory.includes("p20")) { player.inventory.push("p20"); addSys("🌀 Бездна ответила! + Клинок бездны (легендарный)"); recalcBonus(); } else player.gold += 1000; saveGame(); updateUI(); } else addSys("Бездна безмолвна (победи Повелителя бездны)"); return true; }
        if (w === "феникс") { if (!player.secretFlags.phoenixUsed && player.hp <= 0) { player.secretFlags.phoenixUsed = true; player.hp = Math.floor(player.maxHp * 0.5); addSys("🔥 Феникс возродил тебя! +50% HP"); updateUI(); saveGame(); } else if (player.hp > 0) addSys("Феникс ждёт твоей гибели..."); return true; }
        if (w === "тишина") { player.gold += 140; addSys("🤫 Тишина... +140 золота"); updateUI(); saveGame(); return true; }
        if (w === "секреты") { let found = (player.secretFlags.mapUsed?1:0)+(player.secretFlags.dawnUsed?1:0)+(player.secretFlags.abyssUsed?1:0)+(player.secretFlags.phoenixUsed?1:0); addSys(`🔎 Ты нашёл ${found} секретов из многих. Продолжай искать...`); return true; }
        return false;
    }

    function saveGame() { localStorage.setItem("RPG_SAVE", JSON.stringify({ level: player.level, xp: player.xp, gold: player.gold, hp: player.hp, maxHp: player.maxHp, inventory: player.inventory, bossIndex: player.bossIndex, questIndex: player.questIndex, secretFlags: player.secretFlags })); }
    function loadGame() {
        let raw = localStorage.getItem("RPG_SAVE");
        if (raw) { let d = JSON.parse(raw); player.level = d.level; player.xp = d.xp; player.gold = d.gold; player.hp = d.hp; player.maxHp = d.maxHp; player.inventory = d.inventory; player.bossIndex = d.bossIndex; player.questIndex = d.questIndex; player.secretFlags = d.secretFlags || {}; addSys(`📀 Загружено.`); }
        else { player.inventory = ["p1"]; addSys(`🎁 Стартовый кинжал.`); }
        updateUI();
    }

    function process(cmd) {
        let parts = cmd.trim().split(" ");
        let main = parts[0].toLowerCase();
        if (main === "атака") attack();
        else if (main === "лечить") heal();
        else if (main === "кейс") caseOpen();
        else if (main === "магазин") shop();
        else if (main === "инвентарь") inv();
        else if (main === "статы") statsCmd();
        else if (main === "помощь") help();
        else if (main === "квесты") showQuests();
        else if (main === "квест" && parts[1]) startQuest(parseInt(parts[1]));
        else if (main === "боссы") showBosses();
        else if (main === "босс" && parts[1]) startBoss(parseInt(parts[1]));
        else if (main === "купить" && parts[1]) buy(parts[1]);
        else { if (!checkSecrets(cmd)) addSys(`❓ Неизвестно. помощь`); }
    }

    document.getElementById("sendBtn").onclick = () => { let inp = document.getElementById("cmdInput"); let val = inp.value.trim(); if (val) process(val); inp.value = ""; };
    document.getElementById("cmdInput").addEventListener("keypress", (e) => { if (e.key === "Enter") document.getElementById("sendBtn").click(); });
    loadGame();
</script>
</body>
</html>
